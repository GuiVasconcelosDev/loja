server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:lojadb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2

app:
  jwt:
    secret: ${APP_JWT_SECRET:app_jwt_secret_32bytes_minimum_required}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}   # 24h