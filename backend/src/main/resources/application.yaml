server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:lojadb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-dev-only-secret-32bytes-minimum-required}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}   # 24h